name: Deploy Application to Azure

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # 릴리즈 태그 (v1.0.0 등)
    paths:
      - 'implementations/**'
      - '.github/workflows/deploy-app.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'implementations/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상 선택'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend

jobs:
  # --- 1. 공통 테스트 (CI) ---
  # PR과 모든 푸시에서 실행되어 코드의 결함을 먼저 잡습니다.
  test-and-verify:
    name: Test and Verify (E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: implementations/client/package-lock.json

      - name: Install Dependencies 📦
        run: npm install
        working-directory: implementations/client

      - name: Build 🏗️
        run: npx vite build --base ./
        working-directory: implementations/client
        env:
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
          VITE_ENABLE_MOCKING: "true"

      - name: Install Playwright Browsers 🌐
        run: npx playwright install --with-deps chromium
        working-directory: implementations/client

      - name: Run E2E Tests 🧪
        run: npm run test:e2e
        working-directory: implementations/client
        env:
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
          VITE_ENABLE_MOCKING: "true"

  # --- 2. 프론트엔드 배포 (CD) ---
  # 테스트가 성공하고, main 브랜치 푸시/태그/수동 실행인 경우에만 진행합니다.
  deploy-frontend:
    name: Deploy Frontend
    needs: test-and-verify
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Dependencies 📦
        run: npm install
        working-directory: implementations/client

      - name: Build 🏗️
        run: npx vite build --base ./
        working-directory: implementations/client
        env:
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
          VITE_ENABLE_MOCKING: "true"
          VITE_API_BASE_URL: "https://app-term-proj-team7-server.azurewebsites.net"

      - name: Deploy to Azure Static Web Apps 🚀
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "implementations/client"
          output_location: "dist"
          app_build_command: "npm run build"
        env:
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
          VITE_ENABLE_MOCKING: "true"
          VITE_API_BASE_URL: "https://app-term-proj-team7-server.azurewebsites.net"

  # --- 3. 백엔드 배포 (CD) ---
  deploy-backend:
    name: Build and Deploy Backend
    needs: test-and-verify
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up JDK 17 ☕
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew 🔑
        run: chmod +x gradlew
        working-directory: implementations/server

      - name: Build with Gradle 🏗️
        run: ./gradlew build -x test
        working-directory: implementations/server

      - name: Login to Azure 🔑
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service 🚀
        uses: azure/webapps-deploy@v3
        with:
          app-name: "app-term-proj-team7-server"
          package: implementations/server/build/libs/*-SNAPSHOT.jar
