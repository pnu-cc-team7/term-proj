name: Deploy Application to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'implementations/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  # --- 프론트엔드 배포 (Azure Static Web Apps) ---
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy 🚀
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### 프로젝트 구조 설정 ######
          app_location: "/implementations/client" # 프론트엔드 소스 코드 경로
          api_location: "" # (선택사항) API/Functions 경로
          output_location: "dist" # 빌드 결과물 경로 (Vite/React 기본값)
          ##############################

  # --- 백엔드 배포 (Azure App Service) ---
  # TODO: 백엔드 팀원의 기술 스택 결정 후 빌드/배포 스텝 완성 필요
  deploy-backend:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend (Placeholder)
    needs: deploy-frontend # 프론트엔드 배포 후 진행 (순차 배포 설정)
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Placeholder Step
        run: |
          echo "백엔드 기술 스택이 결정되면 이 부분에 빌드 및 배포 로직을 추가해 주세요."
          echo "예: azure/webapps-deploy@v2 액션 사용"
