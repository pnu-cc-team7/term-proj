name: Deploy Application to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'implementations/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  # --- 프론트엔드 빌드 및 배포 ---
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: implementations/client/package-lock.json

      - name: Install and Build 🏗️
        run: |
          npm install
          # --base ./ 를 빌드 명령어에 직접 주입하여 경로 독립성 확보
          ./node_modules/.bin/vite build --base ./
        working-directory: implementations/client
        env:
          VITE_KAKAO_MAP_KEY: "987ebb0c4378e1e9ff07b62f0a35dbfd"

      - name: Deploy to Azure Static Web Apps 🚀
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### 물리적으로 빌드된 dist 폴더만 전송 ######
          skip_app_build: true
          app_location: "implementations/client/dist"
          output_location: ""
          #########################################

  # --- 백엔드 빌드 및 배포 ---
  deploy-backend:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up JDK 17 ☕
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle 🏗️
        run: |
          chmod +x gradlew
          ./gradlew build -x test
        working-directory: implementations/server

      - name: Azure Login 🔑
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service 🚀
        uses: azure/webapps-deploy@v3
        with:
          app-name: "app-term-proj-team7-server"
          package: implementations/server/build/libs/*-SNAPSHOT.jar
