name: Deploy Application to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'implementations/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  # --- 프론트엔드 배포 (Azure Static Web Apps) ---
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy 🚀
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### 프로젝트 구조 설정 ######
          app_location: "implementations/client" # 프론트엔드 소스 코드 경로 (슬래시 제거)
          api_location: "" # (선택사항) API/Functions 경로
          output_location: "dist" # 빌드 결과물 경로 (Vite/React 기본값)
          ##############################

  # --- 백엔드 배포 (Azure App Service) ---
  deploy-backend:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up JDK 17 ☕
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: implementations/server

      - name: Build with Gradle 🏗️
        run: ./gradlew build -x test
        working-directory: implementations/server

      - name: Deploy to Azure App Service 🚀
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-term-proj-team7-server'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: implementations/server/build/libs/*.jar
