name: Deploy Application to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'implementations/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  # --- 프론트엔드 배포 (Azure Static Web Apps) ---
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy 🚀
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### 프로젝트 구조 설정 ######
          app_location: "implementations/client"
          api_location: ""
          output_location: "dist"
          app_build_command: "npm install && npm run build"
          ##############################

  # --- 백엔드 배포 (Azure App Service) ---
  deploy-backend:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up JDK 17 ☕
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle 🏗️
        run: |
          chmod +x gradlew
          ./gradlew build -x test
        working-directory: implementations/server

      - name: Azure Login 🔑
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service 🚀
        uses: azure/webapps-deploy@v3
        with:
          app-name: "app-term-proj-team7-server"
          # 중복 매칭 방지를 위해 plain jar를 제외한 실행 가능한 jar만 특정
          package: implementations/server/build/libs/*-SNAPSHOT.jar
