server {
    listen 80;
    server_name pnu-team7-prod.duckdns.org;

    # 1. 프론트엔드 정적 파일 서빙 (오라클 머신 내부 경로)
    root /home/ubuntu/term-proj-staging/implementations/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. 백엔드 API 프록시 (Azure App Service로 전달)
    # 모든 API 요청(/auth, /votes 등)을 Azure 서버로 보냅니다.
    location /auth/ {
        proxy_pass http://app-term-proj-team7-server.azurewebsites.net;
        proxy_http_version 1.1;
        proxy_set_header Host app-term-proj-team7-server.azurewebsites.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /votes/ {
        proxy_pass http://app-term-proj-team7-server.azurewebsites.net;
        proxy_http_version 1.1;
        proxy_set_header Host app-term-proj-team7-server.azurewebsites.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 타임아웃 설정 (Cold Start 대비)
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
