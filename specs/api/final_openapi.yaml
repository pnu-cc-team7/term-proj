openapi: 3.0.3
info:
  title: Social Voting Platform API (Team 7 - Final)
  version: 2.1.2
  description: |
    카카오 로그인 연동 및 위치 기반 맛집 투표 기능을 제공하는 서비스의 공식 API 명세입니다.

paths:
  /auth/kakao:
    post:
      tags: [Identification]
      summary: 카카오 토큰으로 서비스 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  type: string
                  description: 카카오 SDK에서 발급받은 Access Token
      responses:
        '200':
          description: 성공 (Http-Only Cookie 발급)
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=abc...; HttpOnly; Secure; SameSite=None
        '401':
          description: 유효하지 않은 토큰

  /votes:
    get:
      tags: [Vote]
      summary: 전체 투표 목록 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vote'
    post:
      tags: [Vote]
      summary: 신규 투표 생성 (인증 필요)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteCreate'
      responses:
        '201':
          description: 생성 성공

  /votes/{id}/participate:
    post:
      tags: [Vote]
      summary: 특정 투표에 참여 (인증 필요)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                optionIds:
                  type: array
                  items:
                    type: string
                  description: "선택한 모든 맛집 후보 ID 리스트"
      responses:
        '200':
          description: 참여 성공

  /votes/{id}/results:
    get:
      tags: [Vote]
      summary: 투표 결과(단순 득표수) 조회
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalVotes: { type: integer }
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        optionId: { type: string }
                        name: { type: string }
                        count: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Vote:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status:
          type: string
          enum: [open, closed]
          description: "투표 진행 상태"
        options:
          type: array
          items: { $ref: '#/components/schemas/VoteOption' }
    VoteOption:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kakao_id: { type: string }
        lat: { type: number }
        lng: { type: number }
    VoteCreate:
      type: object
      properties:
        title: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kakao_id: { type: string }
              lat: { type: number }
              lng: { type: number }
