openapi: 3.0.3
info:
  title: "Restaurant Social Voting API (v0.0.1 - 초단순 샘플)"
  version: 0.0.1
  description: |
    ⚠️ **[중요 알림] 본 명세는 '중간 보고서 제출용'으로 작성된 임시 샘플입니다.**
    
    팀장이 프로젝트 구조와 보고서 작성을 위해 임의로 설계한 초안이며, 
    중간 보고 이후 **본격적인 개발 착수 시 팀원 간 협의를 통해 얼마든지 변경/확장될 수 있습니다.**
    
    - **단순화 사항**: 복잡한 소셜 로그인 대신 '닉네임 입력'으로 대체.
    - **범위**: 텍스트 기반 투표 및 결과 조회.
    
servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 서버

tags:
  - name: Identification
    description: 간단 유저 식별 (로그인 대체)
  - name: Vote
    description: 투표 상호작용 (MVP 핵심)

paths:
  /enter:
    post:
      tags: [Identification]
      summary: "닉네임으로 입장 (US-B01)"
      description: "복잡한 인증 대신 닉네임만으로 세션을 식별하는 초단순 접근 방식입니다."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string, example: "맛잘알" }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  nickname: { type: string }

  /votes:
    get:
      tags: [Vote]
      summary: "투표 목록 조회"
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vote'
    post:
      tags: [Vote]
      summary: "신규 투표 생성 (US-V01)"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteCreate'
      responses:
        '201':
          description: 생성됨

  /votes/{id}/participate:
    post:
      tags: [Vote]
      summary: "투표 참여 (US-V02)"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                optionId: { type: string }
      responses:
        '200':
          description: 참여 완료

  /votes/{id}/results:
    get:
      tags: [Vote]
      summary: "투표 결과 조회 (US-V03)"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResult'

components:
  schemas:
    Vote:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              content: { type: string }

    VoteCreate:
      type: object
      required: [title, options]
      properties:
        title: { type: string }
        description: { type: string }
        options:
          type: array
          items: { type: string }

    VoteResult:
      type: object
      properties:
        voteId: { type: string }
        totalVotes: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              optionId: { type: string }
              count: { type: integer }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
